<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Comparison Analysis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=Outfit:wght@300;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #0a0a0c;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent: #6366f1;
            --text: #f8fafc;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(168, 85, 247, 0.15) 0%, transparent 40%);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            animation: fadeIn 1.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 3.5rem;
            font-weight: 800;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #94a3b8;
            margin-bottom: 40px;
            font-weight: 300;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: center;
        }

        .chart-container {
            position: relative;
            height: 400px;
            width: 100%;
        }

        .info-list {
            list-style: none;
        }

        .info-item {
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            border-left: 4px solid var(--accent);
            transition: transform 0.3s ease;
        }

        .info-item:hover {
            transform: translateX(10px);
            background: rgba(255, 255, 255, 0.06);
        }

        .info-item strong {
            display: block;
            color: var(--accent);
            font-size: 0.9rem;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .info-item p {
            font-size: 1.1rem;
            line-height: 1.4;
        }

        @media (max-width: 968px) {
            .grid { grid-template-columns: 1fr; }
            h1 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="glass-card">
        <h1>CRM Comparison</h1>
        <p class="subtitle">Сравнительный анализ Open Source решений</p>
        
        <div class="grid">
            <div classrag>
                <div class="info-list">
                    <div class="info-item">
                        <strong>SuiteCRM</strong>
                        <p>Enterprise-уровень, максимальная кастомизация и мощная функциональность.</p>
                    </div>
                    <div class="info-item">
                        <strong>EspoCRM</strong>
                        <p>Быстрые продажи, современный SPA-интерфейс и отличный API.</p>
                    </div>
                    <div class="info-item">
                        <strong>Frappe CRM</strong>
                        <p>Легкость, современный Vue.js и фокус на воронку продаж.</p>
                    </div>
                </div>
            </div>

            <div class="chart-container">
                <canvas id="comparisonChart"></canvas>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const ctx = document.getElementById('comparisonChart').getContext('2d');
        
        const data = {
            labels: ['Масштабируемость', 'Кастомизация', 'Простота', 'Интерфейс', 'Скорость'],
            datasets: [
                {
                    label: 'SuiteCRM',
                    data: [5, 5, 2, 2, 3],
                    fill: true,
                    backgroundColor: 'rgba(99, 102, 241, 0.2)',
                    borderColor: '#6366f1',
                    pointBackgroundColor: '#6366f1',
                },
                {
                    label: 'EspoCRM',
                    data: [4, 4, 4, 4, 4],
                    fill: true,
                    backgroundColor: 'rgba(168, 85, 247, 0.2)',
                    borderColor: '#a855f7',
                    pointBackgroundColor: '#a855f7',
                },
                {
                    label: 'Frappe CRM',
                    data: [2, 2, 5, 5, 5],
                    fill: true,
                    backgroundColor: 'rgba(34, 197, 94, 0.2)',
                    borderColor: '#22c55e',
                    pointBackgroundColor: '#22c55e',
                }
            ]
        };

        new Chart(ctx, {
            type: 'radar',
            data: data,
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    r: {
                        angleLines: { color: 'rgba(255,255,255,0.1)' },
                        grid: { color: 'rgba(255,255,255,0.1)' },
                        pointLabels: { color: '#94a3b8', font: { size: 12 } },
                        ticks: { display: false, max: 5, stepSize: 1 }
                    }
                },
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: { color: '#f8fafc', padding: 20, font: { size: 14 } }
                    }
                }
            }
        });
    });
</script>

</body>
</html>
