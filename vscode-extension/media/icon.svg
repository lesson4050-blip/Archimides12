<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Premium Gradient -->
    <linearGradient id="glowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a4eff" />
      <stop offset="60%" stop-color="#7c6fff" />
      <stop offset="100%" stop-color="#b8aeff" />
    </linearGradient>
    
    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Background Plate (Optional but premium) -->
  <rect width="128" height="128" rx="28" fill="#07070d" stroke="rgba(255, 255, 255, 0.05)" stroke-width="2" />

  <!-- Orbit Rings (Micro-details) -->
  <circle cx="64" cy="64" r="42" fill="none" stroke="rgba(124, 111, 255, 0.15)" stroke-width="1.5" stroke-dasharray="6 4" />
  <circle cx="64" cy="64" r="32" fill="none" stroke="rgba(184, 174, 255, 0.1)" stroke-width="1" />

  <!-- Geometric "A" Glyph (Archimedes/Antigravity Delta) -->
  <g filter="url(#neonGlow)">
    <!-- Outer Delta Frame -->
    <path d="M64 26 L102 92 L26 92 Z" fill="none" stroke="url(#glowGrad)" stroke-width="7" stroke-linejoin="round" />
    
    <!-- Inner Core Orbit/Core -->
    <circle cx="64" cy="68" r="10" fill="#07070d" stroke="url(#glowGrad)" stroke-width="4.5" />
    
    <!-- Core Accent -->
    <circle cx="64" cy="68" r="4" fill="#ffffff" />
    
    <!-- Tech Slices -->
    <path d="M42 80 L86 80" stroke="#07070d" stroke-width="4" stroke-linecap="round" />
    <path d="M64 26 L64 42" stroke="url(#glowGrad)" stroke-width="3.5" stroke-linecap="round" />
  </g>
</svg>
