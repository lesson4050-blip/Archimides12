# k8s/deployment.yaml — Kubernetes deployment manifest
apiVersion: apps/v1
kind: Deployment
metadata:
  name: archimedes-backend
  labels:
    app: archimedes
    component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: archimedes
      component: backend
  template:
    metadata:
      labels:
        app: archimedes
        component: backend
    spec:
      containers:
        - name: archimedes
          image: archimedes:latest
          ports:
            - containerPort: 8000
          env:
            - name: OLLAMA_BASE_URL
              value: "http://ollama-service:11434"
            - name: AUTH_ENABLED
              value: "true"
            - name: LOG_FORMAT
              value: "json"
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "4000m"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: archimedes-data
---
apiVersion: v1
kind: Service
metadata:
  name: archimedes-backend
spec:
  selector:
    app: archimedes
    component: backend
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: archimedes-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
