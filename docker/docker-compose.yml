version: '3.8'

services:
  # Основной контейнер Archimedes COSMO
  archimedes:
    build:
      context: ..
      dockerfile: docker/sandbox.Dockerfile
    container_name: archimedes-cosmo
    hostname: archimedes-cosmo
    
    ports:
      - "8000:8000"    # Backend API
      - "3000:3000"    # Frontend
    
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=gemma4:26b
      - DATABASE_URL=postgresql+asyncpg://archimedes:archimedes@postgres:5432/archimedes
      - DATABASE_URL_SQLITE=sqlite+aiosqlite:///./data/archemidas.db
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws
      - AUTH_ENABLED=false
      - ENVIRONMENT=production
      - AGENT_TASK_TIMEOUT=300
    
    volumes:
      - ../workspace:/app/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    
    networks:
      - archimedes-network
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy

  # Ollama для локальных моделей
  ollama:
    image: ollama/ollama:latest
    container_name: archimedes-ollama
    hostname: ollama
    
    ports:
      - "11434:11434"
    
    volumes:
      - ollama-data:/root/.ollama
    
    networks:
      - archimedes-network
    
    restart: unless-stopped
    
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PostgreSQL — production database
  postgres:
    image: postgres:16-alpine
    container_name: archimedes-postgres
    hostname: postgres
    
    ports:
      - "5432:5432"
    
    environment:
      POSTGRES_USER: archimedes
      POSTGRES_PASSWORD: archimedes
      POSTGRES_DB: archimedes
    
    volumes:
      - postgres-data:/var/lib/postgresql/data
    
    networks:
      - archimedes-network
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archimedes"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ollama-data:
    driver: local
  postgres-data:
    driver: local

networks:
  archimedes-network:
    driver: bridge
