integrations:
  github:
    scopes:
      - repo
      - read:user
      - user:email
      - read:org
  gmail:
    scopes:
      - https://www.googleapis.com/auth/gmail.modify
      - https://www.googleapis.com/auth/gmail.send
  google-drive:
    scopes:
      - https://www.googleapis.com/auth/drive
  google-calendar:
    scopes:
      - https://www.googleapis.com/auth/calendar
  slack:
    scopes:
      - channels:read
      - channels:history
      - chat:write
      - users:read
      - files:write
  notion:
    scopes:
      - []
  linear:
    scopes:
      - read
      - write
  jira:
    scopes:
      - read:jira-work
      - write:jira-work
  discord:
    scopes:
      - bot
  hubspot:
    scopes:
      - crm.objects.contacts.read
      - crm.objects.contacts.write
  salesforce:
    scopes:
      - api
      - refresh_token
  stripe: {}
  airtable: {}
  dropbox:
    scopes:
      - files.content.read
      - files.content.write
  twitter:
    scopes:
      - tweet.read
      - tweet.write
      - users.read
  linkedin:
    scopes:
      - r_liteprofile
      - r_emailaddress
      - w_member_social
  asana:
    scopes:
      - default
  trello: {}
  figma:
    scopes:
      - files:read
  vercel: {}
  supabase: {}
  sendgrid: {}
  twilio: {}
