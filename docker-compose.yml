version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: archimedes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: archimedes
      POSTGRES_PASSWORD: archimedes
      POSTGRES_DB: archimedes
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archimedes"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

  cosmo-artist:
    build:
      context: ./cosmo_artist
      dockerfile: Dockerfile.artist
    container_name: cosmo_artist
    ports:
      - "3005:3005"
    environment:
      - PORT=3005
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_PUBLIC_SERVER_URL=http://cosmo-engine:5051
    depends_on:
      - postgres
    restart: unless-stopped
