version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: archimedes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: archimedes
      POSTGRES_PASSWORD: archimedes
      POSTGRES_DB: archimedes
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archimedes"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
