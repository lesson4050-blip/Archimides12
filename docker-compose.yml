version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: archimedes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: archimedes
      POSTGRES_PASSWORD: archimedes
      POSTGRES_DB: archimedes
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archimedes"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

  archimedes-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: archimedes-backend
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - DATABASE_URL=postgresql+asyncpg://archimedes:archimedes@postgres:5432/archimedes
    depends_on:
      - postgres
    volumes:
      - ./data:/app/data
      - ./workspace:/app/workspace
    restart: unless-stopped

  cosmo-artist:
    build:
      context: ./cosmo_artist
      dockerfile: Dockerfile.artist
    container_name: cosmo_artist
    ports:
      - "3005:3005"
    environment:
      - PORT=3005
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_PUBLIC_SERVER_URL=http://archimedes-backend:8000
    depends_on:
      - postgres
    restart: unless-stopped
