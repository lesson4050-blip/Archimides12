services:
  postgres:
    image: postgres:16-alpine
    container_name: archimedes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: archimedes
      POSTGRES_PASSWORD: archimedes
      POSTGRES_DB: archimedes
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archimedes"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  archimedes-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: archimedes-backend
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - DATABASE_URL=postgresql+asyncpg://archimedes:archimedes@postgres:5432/archimedes
      - AUTH_ENABLED=True
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./workspace:/app/workspace
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "4.0"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  cosmo-artist:
    build:
      context: ./cosmo_artist
      dockerfile: Dockerfile.artist
    container_name: cosmo_artist
    ports:
      - "3005:3005"
    environment:
      - PORT=3005
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_PUBLIC_SERVER_URL=http://archimedes-backend:8000
    depends_on:
      - archimedes-backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

volumes:
  postgres_data:
    driver: local
