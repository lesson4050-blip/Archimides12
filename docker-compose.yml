services:
  postgres:
    image: postgres:16-alpine
    container_name: archimedes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-archimedes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-archimedes}
      POSTGRES_DB: ${POSTGRES_DB:-archimedes}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-archimedes}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  ollama:
    image: ollama/ollama:latest
    container_name: archimedes-ollama
    volumes:
      - ollama_data:/root/.ollama
    expose:
      - "11434"
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 5

  archimedes-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: archimedes-backend
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - OLLAMA_BASE_URL=http://ollama:11434
      - DATABASE_URL=postgresql+asyncpg://archimedes:archimedes@postgres:5432/archimedes
      - AUTH_ENABLED=True
      - METRICS_BEARER_TOKEN=${METRICS_BEARER_TOKEN}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
    networks:
      - internal
      - frontend
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./workspace:/app/workspace
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "4.0"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  cosmo-artist:
    build:
      context: ./cosmo_artist
      dockerfile: Dockerfile.artist
    container_name: cosmo_artist
    ports:
      - "3005:3005"
    environment:
      - PORT=3005
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_PUBLIC_SERVER_URL=http://archimedes-backend:8000
    networks:
      - frontend
    depends_on:
      - archimedes-backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  prometheus:
    image: prom/prometheus:latest
    container_name: archimedes-prometheus
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - internal
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: archimedes-grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - internal
      - frontend
    depends_on:
      - prometheus
      - tempo
    restart: unless-stopped

  tempo:
    image: grafana/tempo:latest
    container_name: archimedes-tempo
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./docker/tempo/tempo.yaml:/etc/tempo.yaml
      - tempo_data:/var/tempo
    ports:
      - "4317:4317"  # OTLP gRPC
      - "4318:4318"  # OTLP HTTP
    networks:
      - internal
    restart: unless-stopped

networks:
  internal:
    driver: bridge
    internal: true
  frontend:
    driver: bridge

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  ollama_data:
  tempo_data:
