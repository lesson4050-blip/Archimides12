name: Archimedes CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-mock pytest-cov pytest-timeout

      - name: Run ALL unit tests with coverage
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || 'test_key_ci' }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY || 'test_key_ci' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || '' }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY || 'test_key_ci' }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest tests/ -v --tb=short --timeout=60 \
            --cov=backend --cov-report=term-missing \
            --ignore=tests/e2e_tester.py \
            --ignore=tests/test_e2e.py \
            -m "not integration" \
            -o "addopts="

      - name: Security audit — no eval() in production
        run: |
          if grep -rn "eval(" backend/ --include="*.py" | grep -v "test_" | grep -v "^.*#" | grep -v "\.pyc"; then
            echo "WARNING: eval() found in production code"
          fi

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check backend/ --exit-zero

      - name: Security dependency audit
        run: |
          pip install pip-audit
          pip-audit --strict --ignore-vuln PYSEC-2024-* || true
